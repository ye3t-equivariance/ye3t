name: ye3t CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: package tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install native build prerequisite
        run: |
          python -m pip install "setuptools>=77,<82" torch wheel --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install -e ".[dev]" --no-build-isolation
      - name: Run tests
        run: python -P -m pytest -m fast

  artifacts:
    name: build artifacts and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tools
        run: |
          python -m pip install build "setuptools>=77,<82" torch wheel numpy --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Build wheel and sdist
        run: python -m build --no-isolation
      - name: Audit Linux wheel dependencies
        run: python cmake/audit_linux_wheel.py dist/*.whl
      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Smoke import and native extensions
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/cmake/smoke_installed_package.py"

  docs:
    name: sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native build prerequisite
        run: |
          python -m pip install "setuptools>=77,<82" torch wheel --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install package with docs extra
        run: python -m pip install -e ".[docs]" --no-build-isolation
      - name: Build documentation
        run: sphinx-build -W docs docs/_build/html

